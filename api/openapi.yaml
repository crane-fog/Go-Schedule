openapi: 3.0.3
info:
    title: Go-Schedule API
    version: 0.1.0
    description: |
        练习用日程与记事板服务 API。

        统一响应约定：
        - 所有 JSON 接口的 HTTP 状态码固定为 `200`；
        - 业务状态由响应 JSON 中的 `code` 字段表示：`200` 成功、`400` 参数错误、`404` 资源不存在、`500` 服务器内部错误；
        - JSON 响应体统一为 `{"code": xxx, "data": ...}`；
        - 成功时 `data` 为业务数据，失败时 `data` 为 `{"message": "..."}`；
        - 图片读取接口（`GET /api/v1/notes/images/{filename}`）直接返回图片文件流（`image/*`），文件不存在时返回 HTTP `404`；
        - 日程列表按规则排序：未完成在前、开始时间升序、开始时间相同时优先级降序；
        - 记事页签列表按规则排序：`sort_order` 升序、`id` 升序。

        日程使用统一的 `Schedule` 结构，由 `type` 决定哪些字段生效：
        - `one_time`：只使用 `happen_time`；
        - `time_range`：只使用 `start_at` / `end_at`，两个时间都允许为 `null`；
        - `recurring`：只使用 `recurrence`。
        当前类型不使用的字段统一返回 `null`。

servers:
    - url: http://localhost:9276
      description: 本地开发环境

tags:
    - name: schedules
      description: 日程的增删改查
    - name: notes
      description: 多页签 Markdown 记事板及图片上传读取

paths:
    /api/v1/schedules:
        get:
            tags: [schedules]
            operationId: listSchedules
            summary: 获取日程列表
            responses:
                "200":
                    description: 成功时 `data` 为日程数组；失败时 `data` 为错误详情
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/ScheduleListResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            - id: 1
                                              title: 提交周报
                                              type: one_time
                                              priority: 2
                                              done: false
                                              created_at: "2026-11-02T08:30:00Z"
                                              happen_time: "2026-11-02T18:00:00Z"
                                              start_at: null
                                              end_at: null
                                              recurrence: null
                                            - id: 2
                                              title: 项目评审
                                              type: time_range
                                              priority: 1
                                              done: false
                                              created_at: "2026-11-02T08:35:00Z"
                                              happen_time: null
                                              start_at: "2026-11-03T09:00:00Z"
                                              end_at: "2026-11-03T10:00:00Z"
                                              recurrence: null
                                            - id: 3
                                              title: 站会
                                              type: recurring
                                              priority: 0
                                              done: false
                                              created_at: "2026-11-02T08:40:00Z"
                                              happen_time: null
                                              start_at: null
                                              end_at: null
                                              recurrence:
                                                  frequency: weekly
                                                  interval: 1
                                                  start_at: "2026-11-04T01:00:00Z"
                                                  timezone: Asia/Shanghai
                                internalError:
                                    value:
                                        code: 500
                                        data:
                                            message: 服务器内部错误

        post:
            tags: [schedules]
            operationId: createSchedule
            summary: 新增日程
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateScheduleRequest"
            responses:
                "200":
                    description: 成功时 `data` 为新日程；参数错误时 `code=400`
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/ScheduleResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            id: 1
                                            title: 提交周报
                                            type: one_time
                                            priority: 2
                                            done: false
                                            created_at: "2026-11-02T08:30:00Z"
                                            happen_time: "2026-11-02T18:00:00Z"
                                            start_at: null
                                            end_at: null
                                            recurrence: null
                                invalidRequest:
                                    value:
                                        code: 400
                                        data:
                                            message: one_time 类型必须提供 happen_time

    /api/v1/schedules/{id}:
        put:
            tags: [schedules]
            operationId: updateSchedule
            summary: 修改日程
            description: 全量更新，`type` 决定哪些字段生效，未使用字段传 `null`。
            parameters:
                - $ref: "#/components/parameters/ScheduleId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateScheduleRequest"
            responses:
                "200":
                    description: 成功时 `data` 为更新后的日程；参数错误或资源不存在时返回对应 `code`
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/ScheduleResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            id: 2
                                            title: 项目评审（改期）
                                            type: time_range
                                            priority: 3
                                            done: true
                                            created_at: "2026-11-02T08:35:00Z"
                                            happen_time: null
                                            start_at: "2026-11-03T14:00:00Z"
                                            end_at: "2026-11-03T15:00:00Z"
                                            recurrence: null
                                notFound:
                                    value:
                                        code: 404
                                        data:
                                            message: 日程不存在

        delete:
            tags: [schedules]
            operationId: deleteSchedule
            summary: 删除日程
            parameters:
                - $ref: "#/components/parameters/ScheduleId"
            responses:
                "200":
                    description: 成功时 `data` 为被删除日程的 ID
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/DeleteScheduleResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            id: 1
                                notFound:
                                    value:
                                        code: 404
                                        data:
                                            message: 日程不存在

    /api/v1/notes:
        get:
            tags: [notes]
            operationId: listNotes
            summary: 获取记事页签列表
            description: 返回全部记事页签，按 `sort_order ASC, id ASC` 排序。
            responses:
                "200":
                    description: 成功时 `data` 为记事页签数组；失败时 `data` 为错误详情
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/NoteListResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            - id: 1
                                              title: 日常备忘
                                              content: "# 待办事项\n- 整理周报"
                                              sort_order: 0
                                              created_at: "2026-11-18T08:00:00Z"
                                              updated_at: "2026-11-18T08:30:00Z"
                                internalError:
                                    value:
                                        code: 500
                                        data:
                                            message: 服务器内部错误

        post:
            tags: [notes]
            operationId: createNote
            summary: 新建记事页签
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateNoteRequest"
            responses:
                "200":
                    description: 成功时 `data` 为新建的记事页签；参数错误时 `code=400`
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/NoteResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            id: 1
                                            title: 日常备忘
                                            content: ""
                                            sort_order: 0
                                            created_at: "2026-11-18T08:00:00Z"
                                            updated_at: "2026-11-18T08:00:00Z"
                                invalidRequest:
                                    value:
                                        code: 400
                                        data:
                                            message: title 不能为空

    /api/v1/notes/{id}:
        delete:
            tags: [notes]
            operationId: deleteNote
            summary: 删除记事页签
            parameters:
                - $ref: "#/components/parameters/NoteId"
            responses:
                "200":
                    description: 成功时 `data` 为被删除记事页签的 ID
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/DeleteNoteResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            id: 1
                                notFound:
                                    value:
                                        code: 404
                                        data:
                                            message: 记事页签不存在

    /api/v1/notes/{id}/meta:
        put:
            tags: [notes]
            operationId: updateNoteMeta
            summary: 更新记事页签元信息
            description: 仅更新指定记事页签的标题（`title`）与排序权重（`sort_order`），不修改正文内容；响应中不包含 `content` 字段。
            parameters:
                - $ref: "#/components/parameters/NoteId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateNoteMetaRequest"
            responses:
                "200":
                    description: 成功时 `data` 为更新后的记事页签元信息（不含 `content`）；参数错误或资源不存在时返回对应 `code`
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/NoteMetaResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            id: 1
                                            title: 日常备忘
                                            sort_order: 1
                                            created_at: "2026-11-18T08:00:00Z"
                                            updated_at: "2026-11-18T09:15:00Z"
                                invalidRequest:
                                    value:
                                        code: 400
                                        data:
                                            message: title 不能为空
                                notFound:
                                    value:
                                        code: 404
                                        data:
                                            message: 记事页签不存在

    /api/v1/notes/{id}/content:
        put:
            tags: [notes]
            operationId: updateNoteContent
            summary: 更新记事页签正文
            description: 仅更新指定记事页签的 Markdown 正文内容（`content`），不修改标题与排序权重；响应返回全量记事页签信息。
            parameters:
                - $ref: "#/components/parameters/NoteId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateNoteContentRequest"
            responses:
                "200":
                    description: 成功时 `data` 为更新后的全量记事页签；参数错误或资源不存在时返回对应 `code`
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/NoteResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            id: 1
                                            title: 日常备忘
                                            content: "# 标题\n正文内容..."
                                            sort_order: 0
                                            created_at: "2026-11-18T08:00:00Z"
                                            updated_at: "2026-11-18T09:15:00Z"
                                notFound:
                                    value:
                                        code: 404
                                        data:
                                            message: 记事页签不存在

    /api/v1/notes/images:
        post:
            tags: [notes]
            operationId: uploadNoteImage
            summary: 上传记事图片
            description: 上传单张图片（支持 `.png`、`.jpg`、`.jpeg`、`.gif`、`.webp`、`.svg`、`.bmp`、`.ico`、`.avif`），落盘至服务端配置的 `image_dir` 目录并返回访问 URL。
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file]
                            properties:
                                file:
                                    type: string
                                    format: binary
                                    description: 图片文件
            responses:
                "200":
                    description: 成功时 `data` 为图片文件名与访问 URL；参数错误时 `code=400`
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/NoteImageUploadResponse"
                                    - $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                success:
                                    value:
                                        code: 200
                                        data:
                                            filename: 20261118_123000_a1b2c3d4.svg
                                            url: /api/v1/notes/images/20261118_123000_a1b2c3d4.svg
                                invalidRequest:
                                    value:
                                        code: 400
                                        data:
                                            message: 不支持的图片文件类型

    /api/v1/notes/images/{filename}:
        get:
            tags: [notes]
            operationId: getNoteImage
            summary: 读取记事图片
            description: 直接返回对应图片的文件内容（`image/*`）；若文件不存在则返回 HTTP `404`。
            parameters:
                - $ref: "#/components/parameters/NoteImageFilename"
            responses:
                "200":
                    description: 返回图片二进制或 SVG 内容
                    headers:
                        Cache-Control:
                            description: 浏览器长期强缓存策略（图片文件名唯一且内容不可变）
                            schema:
                                type: string
                                example: private, max-age=31536000, immutable
                    content:
                        image/*:
                            schema:
                                type: string
                                format: binary
                "404":
                    description: 图片文件不存在

components:
    parameters:
        ScheduleId:
            name: id
            in: path
            required: true
            description: 日程 ID
            schema:
                type: integer
                format: int64
                minimum: 1
        NoteId:
            name: id
            in: path
            required: true
            description: 记事页签 ID
            schema:
                type: integer
                format: int64
                minimum: 1
        NoteImageFilename:
            name: filename
            in: path
            required: true
            description: 图片文件名
            schema:
                type: string
                minLength: 1

    schemas:
        Schedule:
            type: object
            required:
                [
                    id,
                    title,
                    type,
                    priority,
                    done,
                    created_at,
                    happen_time,
                    start_at,
                    end_at,
                    recurrence,
                ]
            properties:
                id: { type: integer, format: int64 }
                title: { type: string, minLength: 1 }
                description:
                    type: string
                    description: 日程描述（可选）
                type:
                    type: string
                    enum: [one_time, time_range, recurring]
                    description: |
                        日程类型：
                        - `one_time`：只使用 `happen_time`
                        - `time_range`：只使用 `start_at` / `end_at`
                        - `recurring`：只使用 `recurrence`
                priority: { type: integer, default: 0 }
                done:
                    type: boolean
                    description: 是否已完成
                created_at: { type: string, format: date-time, readOnly: true }
                happen_time:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `one_time` 使用；其他类型为 `null`
                start_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `time_range` 使用，可为 `null`；其他类型为 `null`
                end_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `time_range` 使用，可为 `null`；其他类型为 `null`
                recurrence:
                    nullable: true
                    allOf:
                        - $ref: "#/components/schemas/Recurrence"
                    description: 仅 `recurring` 使用；其他类型为 `null`

        Recurrence:
            type: object
            description: |
                定期重复配置。每个发生点视为一次 `one_time` 事件。
                `interval` 表示“每隔几个 frequency 单位”，不是固定天数。
                `until` 与 `count` 二选一，都不提供表示无限重复。
                `timezone` 由客户端自动注入创建/修改时的设备时区，用于锚定重复规则的日历与挂钟时间。
            required: [frequency, start_at, timezone]
            properties:
                frequency:
                    type: string
                    enum: [daily, weekly, monthly, yearly]
                    description: 重复频率
                interval:
                    type: integer
                    minimum: 1
                    default: 1
                    description: |
                        重复间隔，单位由 `frequency` 决定：
                        - `daily`：每 `interval` 天
                        - `weekly`：每 `interval` 周
                        - `monthly`：每 `interval` 个月
                        - `yearly`：每 `interval` 年
                        默认值为 1，表示每个频率单位发生一次。
                start_at:
                    type: string
                    format: date-time
                    description: 第一次发生时间，同时决定后续发生的时间点
                until:
                    type: string
                    format: date-time
                    nullable: true
                    description: 重复截止时间（包含）；与 `count` 二选一
                count:
                    type: integer
                    minimum: 1
                    nullable: true
                    description: 最多发生次数；与 `until` 二选一
                timezone:
                    type: string
                    description: 创建/修改该周期日程时的设备 IANA 时区（如 `Asia/Shanghai`），由客户端自动注入，用于计算每次发生的时间点
                completed_indices:
                    type: array
                    items:
                        type: integer
                        minimum: 1
                    description: 已完成的发生序号列表（从 1 开始，例如 `[1, 3]` 表示第 1 次和第 3 次发生已完成）

        CreateScheduleRequest:
            type: object
            required: [title, type]
            properties:
                title: { type: string, minLength: 1 }
                description:
                    type: string
                    description: 日程描述（可选）
                type:
                    type: string
                    enum: [one_time, time_range, recurring]
                    description: 日程类型，决定需要提供哪些字段
                priority: { type: integer, default: 0 }
                happen_time:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `one_time` 使用，且该类型下必填；其他类型传 `null` 或省略
                start_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `time_range` 使用，可为 `null`；其他类型传 `null` 或省略
                end_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `time_range` 使用，可为 `null`；其他类型传 `null` 或省略
                recurrence:
                    nullable: true
                    allOf:
                        - $ref: "#/components/schemas/Recurrence"
                    description: 仅 `recurring` 使用，且该类型下必填；其他类型传 `null` 或省略

        UpdateScheduleRequest:
            type: object
            required: [title, type, priority]
            properties:
                title: { type: string, minLength: 1 }
                description:
                    type: string
                    description: 日程描述（可选）
                type:
                    type: string
                    enum: [one_time, time_range, recurring]
                    description: 日程类型，决定需要提供哪些字段
                priority: { type: integer }
                done:
                    type: boolean
                    description: 是否已完成
                happen_time:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `one_time` 使用，且该类型下必填；其他类型传 `null`
                start_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `time_range` 使用，可为 `null`；其他类型传 `null`
                end_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: 仅 `time_range` 使用，可为 `null`；其他类型传 `null`
                recurrence:
                    nullable: true
                    allOf:
                        - $ref: "#/components/schemas/Recurrence"
                    description: 仅 `recurring` 使用，且该类型下必填；其他类型传 `null`

        ScheduleResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [200] }
                data: { $ref: "#/components/schemas/Schedule" }

        ScheduleListResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [200] }
                data:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }

        DeleteScheduleResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [200] }
                data:
                    type: object
                    required: [id]
                    properties:
                        id: { type: integer, format: int64 }

        Note:
            type: object
            required: [id, title, content, sort_order, created_at, updated_at]
            properties:
                id: { type: integer, format: int64 }
                title: { type: string, minLength: 1 }
                content:
                    type: string
                    description: Markdown 正文内容（允许为空字符串）
                sort_order:
                    type: integer
                    format: int32
                    default: 0
                    description: 页签排序权重（按升序排列）
                created_at: { type: string, format: date-time, readOnly: true }
                updated_at: { type: string, format: date-time, readOnly: true }

        NoteMeta:
            type: object
            required: [id, title, sort_order, created_at, updated_at]
            properties:
                id: { type: integer, format: int64 }
                title: { type: string, minLength: 1 }
                sort_order:
                    type: integer
                    format: int32
                    default: 0
                    description: 页签排序权重（按升序排列）
                created_at: { type: string, format: date-time, readOnly: true }
                updated_at: { type: string, format: date-time, readOnly: true }

        CreateNoteRequest:
            type: object
            required: [title]
            properties:
                title: { type: string, minLength: 1 }
                content:
                    type: string
                    default: ""
                    description: Markdown 正文内容（可选，默认为空字符串）
                sort_order:
                    type: integer
                    format: int32
                    default: 0
                    description: 页签排序权重（可选，默认 0）

        UpdateNoteMetaRequest:
            type: object
            required: [title, sort_order]
            properties:
                title: { type: string, minLength: 1 }
                sort_order:
                    type: integer
                    format: int32
                    description: 页签排序权重

        UpdateNoteContentRequest:
            type: object
            required: [content]
            properties:
                content:
                    type: string
                    description: Markdown 正文内容（允许为空字符串）

        NoteResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [200] }
                data: { $ref: "#/components/schemas/Note" }

        NoteMetaResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [200] }
                data: { $ref: "#/components/schemas/NoteMeta" }

        NoteListResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [200] }
                data:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }

        DeleteNoteResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [200] }
                data:
                    type: object
                    required: [id]
                    properties:
                        id: { type: integer, format: int64 }

        NoteImageData:
            type: object
            required: [filename, url]
            properties:
                filename:
                    type: string
                    description: 服务端生成的图片文件名
                url:
                    type: string
                    description: 图片访问路径（可直接用于 Markdown 图片语法）

        NoteImageUploadResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [200] }
                data: { $ref: "#/components/schemas/NoteImageData" }

        ErrorResponse:
            type: object
            required: [code, data]
            properties:
                code: { type: integer, enum: [400, 404, 500] }
                data:
                    type: object
                    required: [message]
                    properties:
                        message: { type: string }
